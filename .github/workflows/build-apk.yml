name: Build APK (OpenWrt 25.12.6 SDK)

# 自动编译 4 个元数据与 iStoreOS 25.12.6 固件对齐的 apk 包。
#
# 重要前提：内核模块 vermagic 强绑定内核版本，本工作流固定使用
# OpenWrt 25.12.6 (linux-6.12.112, gcc-14.3.0/musl, x86_64) 官方 SDK，
# 与实机固件内核一致。若目标固件内核版本变化，必须同步更换 SDK_URL/SDK_SHA256。

on:
  workflow_dispatch:
    inputs:
      luci_ver:
        description: 'luci-app-oaf 版本号'
        required: false
        default: '7.1.0'
      appfilter_ver:
        description: 'appfilter 版本号'
        required: false
        default: '7.1.0'
      kmod_ver:
        description: 'kmod-oaf 版本号'
        required: false
        default: '6.12.112.7.1.0'
      publish_release:
        description: '同时发布 GitHub Release'
        required: false
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - 'oaf/**'
      - 'open-app-filter/**'
      - 'luci-app-oaf/**'
      - 'scripts/**'
      - 'pkgdata/**'
      - 'prebuilt/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'oaf/**'
      - 'open-app-filter/**'
      - 'luci-app-oaf/**'
      - 'scripts/**'

permissions:
  contents: write

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc
  SDK_DIRNAME: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64

jobs:
  build:
    name: 编译并打包 4 个 apk
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装宿主依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget zstd libelf-dev ecj fastjar \
            libtool automake autoconf pkg-config ccache

      - name: 缓存 SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-cache/${{ env.SDK_DIRNAME }}
          key: oaf-sdk-25.12.6-x86-64-${{ env.SDK_SHA256 }}

      - name: 下载并校验官方 SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/sdk-cache"
          cd "${{ runner.temp }}/sdk-cache"
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
          echo "${SDK_SHA256}  sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf sdk.tar.zst
          rm -f sdk.tar.zst

      - name: 源码自检
        run: python3 scripts/check-sources.py

      - name: 编译 + 打包
        env:
          LUCI_VER: ${{ inputs.luci_ver || '7.1.0' }}
          APPFILTER_VER: ${{ inputs.appfilter_ver || '7.1.0' }}
          KMOD_VER: ${{ inputs.kmod_ver || '6.12.112.7.1.0' }}
        run: |
          chmod +x scripts/build-with-sdk.sh
          ./scripts/build-with-sdk.sh \
            "${{ runner.temp }}/sdk-cache/${{ env.SDK_DIRNAME }}" \
            "${{ github.workspace }}/out"

      - name: 汇总产物信息
        run: |
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo '| 文件 | 大小 |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.apk; do
            echo "| $(basename "$f") | $(stat -c%s "$f") B |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 apk 产物
        uses: actions/upload-artifact@v4
        with:
          name: oaf-apk-25.12.6-x86_64
          path: |
            out/*.apk
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: OAF ${{ github.ref_name || github.run_number }} (iStoreOS 25.12.6 / x86_64)
          body: |
            基于 OpenWrt 25.12.6 官方 SDK (linux-6.12.112) 自动编译。
            适用于 iStoreOS 25.12.6 / x86_64；内核模块 vermagic 与该内核绑定。
            安装说明见仓库 docs/INSTALL.md。
          files: |
            out/*.apk
            out/SHA256SUMS
          draft: false
          prerelease: false
