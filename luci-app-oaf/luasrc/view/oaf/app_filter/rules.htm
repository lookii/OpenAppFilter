<link rel="stylesheet" href="<%=resource%>/oaf/css/common.css">
<script src="<%=resource%>/oaf/common.js"></script>
<script src="<%=resource%>/oaf/oaf_pinyin.js"></script>
<script src="<%=resource%>/oaf/jquery-3.7.1.min.js"></script>
<script src="<%=resource%>/oaf/oaf_icon.js"></script>

<style>
    /* 规则列表样式 */
    .rules-list {
        margin-top: 20px;
    }

    .rules-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
    }

    .rules-toolbar h3 {
        margin: 0;
        min-width: 0;
    }

    .rules-toolbar #btn-add-rule {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: auto;
        min-width: max-content;
        white-space: nowrap;
        line-height: 1.4;
    }

    .app-filter-tip {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -6px 0 14px;
        padding: 10px 12px;
        border: 1px solid var(--border-color-low, #e5e7eb);
        border-radius: 6px;
        background: var(--background-color-low, #f5f5f5);
        color: var(--text-color-high, #333);
        font-size: 14px;
        line-height: 1.6;
    }

    .app-filter-tip-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        color: var(--primary-color, #2563eb);
    }

    .app-filter-tip-icon svg {
        width: 16px;
        height: 16px;
        display: block;
    }

    .app-filter-tip-text {
        min-width: 0;
    }

    .app-filter-tip a {
        margin-left: 8px;
        color: var(--primary-color, #2563eb);
        text-decoration: none;
        white-space: nowrap;
    }

    .app-filter-tip a:hover {
        text-decoration: underline;
    }
    
    /* 模式列（第2列）缩小1/3 */
    .rules-list .common-table th:nth-child(2),
    .rules-list .common-table td:nth-child(2) {
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    
    /* 时间列（第3列）增加1/3宽度，移除文字截断限制 */
    .rules-list .common-table th:nth-child(3),
    .rules-list .common-table td:nth-child(3) {
        max-width: 250px;
    }

    /* 确保校验提示弹层浮在添加/编辑对话框之上 */
    .common-modal-mask {
        z-index: 11000;
    }
    
    .time-rules-display {
        display: inline-block;
        vertical-align: middle;
        white-space: normal;
        word-wrap: break-word;
    }
    
    .more-time-btn {
        display: inline-block;
        margin-left: 4px;
        padding: 1px 7px;
        border: 1px solid var(--border-color-low, #e4e7ec);
        border-radius: 6px;
        background: var(--background-color-low, #f9fafb);
        color: var(--text-color-high, #344054);
        font-size: 12px;
        line-height: 18px;
        cursor: pointer;
        vertical-align: middle;
    }

    .more-time-btn:hover {
        background: var(--background-color-medium, #eaecf0);
    }
    
    .time-chart-inline {
        display: inline-block;
        vertical-align: top;
        margin-right: 5px;
    }
    
    .time-chart-inline .time-chart {
        font-size: 7px;
        gap: 0.5px;
    }
    
    .time-chart-inline .time-chart-header {
        padding: 1px 1px;
        min-height: 23px;
        font-size: 5px;
    }
    
    .time-chart-inline .time-chart-time-label {
        padding: 1px;
        font-size: 4px;
    }
    
    .time-chart-inline .time-chart-cell {
        min-height: 12px;
    }
    
    td {
        max-width: 200px;
        word-wrap: break-word;
    }
    
    .time-chart-popup {
        display: none;
        position: fixed;
        background: var(--background-color-high, #fff);
        border: 1px solid var(--border-color-low, #d1d5db);
        border-radius: 5px;
        padding: 10px;
        z-index: 10001;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        color: var(--text-color-high, #1f2937);
        max-width: 90vw;
        overflow-x: auto;
        overflow-y: auto;
        max-height: 80vh;
    }
    
    .time-chart-popup.show {
        display: block;
    }
    
    .time-chart-tooltip {
        position: fixed;
        background: var(--background-color-high, #fff);
        border: 1px solid var(--border-color-low, #d1d5db);
        border-radius: 5px;
        padding: 7px;
        z-index: 10002;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        color: var(--text-color-high, #1f2937);
        pointer-events: none;
        max-width: 90vw;
        overflow-x: auto;
    }
    
    .time-chart-container {
        margin-top: 7px;
    }
    
    .time-chart {
        display: grid;
        grid-template-columns: 42px repeat(24, 26px);
        gap: 1px;
        font-size: 6px;
        overflow-x: auto;
        width: max-content;
        max-width: 100%;
    }
    
    .time-chart-header {
        font-weight: bold;
        text-align: center;
        padding: 3px 1px;
        background: var(--background-color-low, #f5f5f5);
        color: var(--text-color-high, #1f2937);
        writing-mode: horizontal-tb;
        min-height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .time-chart-time-label {
        text-align: center;
        padding: 1px 3px;
        background: var(--background-color-low, #f5f5f5);
        color: var(--text-color-medium, #6b7280);
        font-size: 6px;
        writing-mode: horizontal-tb;
        min-width: 33px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .time-chart-cell {
        width: 100%;
        height: 100%;
        min-height: 17px;
        min-width: 0;
        background: var(--background-color-medium, #eeeeee);
        border: 0.5px solid var(--border-color-low, #d1d5db);
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }
    
    .time-chart-cell-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        background: #f59e0b;
        border-right: 0.5px solid var(--border-color-low, #d1d5db);
    }
    
    .time-chart-cell.active {
        background: #f59e0b;
    }
    
    .rule-actions {
        display: flex;
        gap: 10px;
    }
    
    .btn-edit, .btn-delete {
        padding: 5px 15px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
    }
    
    .btn-edit {
        background: #007bff;
        color: white;
    }
    
    .btn-edit:hover {
        background: #0056b3;
    }
    
    .btn-delete {
        background: #dc3545;
        color: white;
    }
    
    .btn-delete:hover {
        background: #c82333;
    }
    
    /* 添加规则表单样式 */
    .rule-form {
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 20px;
        margin-top: 20px;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #ccc;
        font-size: 13px;
    }

    .form-group .oaf-check-item > label {
        display: inline-flex;
        align-items: center;
        margin: 0;
        line-height: 1.4;
        white-space: nowrap;
    }

    .form-group .oaf-check-item > input[type="checkbox"] {
        margin: 0;
    }
    
    .form-group input[type="text"],
    .form-group input[type="time"],
    .form-group select {
        width: 100%;
        max-width: 300px;
        padding: 8px;
        background: #1e1e1e;
        color: #fff;
        border: 1px solid #555;
        border-radius: 3px;
    }
    
    /* 修复下拉框文字被遮挡的问题 */
    .form-group select {
        line-height: 1.8;
        padding: 10px 8px;
        min-height: 38px;
        box-sizing: border-box;
    }
    
    /* 确保下拉框选项文字不被遮挡 */
    .form-group select option {
        padding: 8px;
        line-height: 1.5;
    }
    
    .form-group input[type="radio"] {
        margin-right: 5px;
    }
    
    .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 5px;
    }
    
    .radio-option {
        display: flex;
        align-items: center;
    }

    .radio-option input[type="radio"] {
        flex: 0 0 auto;
        margin: 0 5px 0 0;
    }

    .radio-option label {
        margin: 0;
        line-height: 1.4;
    }
    
    .time-rules-container {
        margin-top: 10px;
    }
    
    .time-rule-item {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 15px;
        margin-bottom: 10px;
        padding: 10px;
        background: #1e1e1e;
        border-radius: 3px;
        border: 1px solid #444;
    }
    
    .time-rule-weekdays {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        flex: 0 0 auto;
    }

    .time-rule-weekday label {
        white-space: nowrap;
    }
    
    .time-rule-time {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 auto;
    }
    
    .time-rule-time input[type="time"] {
        width: 100px;
        padding: 5px;
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #555;
        border-radius: 3px;
        font-size: 12px;
    }
    
    .time-rule-actions {
        display: flex;
        margin-left: auto;
        flex: 0 0 auto;
    }
    
    .btn-add-time, .btn-remove-time {
        padding: 5px 10px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
    }
    
    .btn-add-time {
        background: #28a745;
        color: white;
    }
    
    .btn-remove-time {
        background: #dc3545;
        color: white;
    }
    
    .app-selection-container {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #555;
        border-radius: 3px;
        padding: 10px;
        background: #1e1e1e;
    }
    
    .category-section {
        margin-bottom: 15px;
    }
    
    .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        background: #2a2a2a;
        border-radius: 3px;
        margin-bottom: 5px;
        cursor: pointer;
    }
    
    .category-header-left {
        display: flex;
        align-items: center;
        flex: 1;
    }
    
    .category-name {
        font-weight: bold;
        color: #fff;
    }
    
    .category-header-right {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .category-count {
        color: #999;
        font-size: 12px;
    }
    
    .arrow {
        width: 12px;
        height: 12px;
        background-image: url('<%=resource%>/oaf/icons/arrow.png');
        background-size: contain;
        background-repeat: no-repeat;
        transition: transform 0.3s ease;
        display: inline-block;
        transform: rotate(0deg);
        flex-shrink: 0;
    }
    
    .arrow.expanded {
        transform: rotate(90deg);
    }
    
    .category-select-all-container {
        display: none;
        margin-top: 5px;
        margin-bottom: 5px;
        margin-left: 10px;
        padding-left: 0;
    }
    
    .category-select-all-container.show {
        display: block !important;
    }
    
    .category-select-all-container input[type="checkbox"] {
        margin: 0 5px 0 0;
        cursor: pointer;
        vertical-align: middle;
    }
    
    .category-select-all-container label {
        margin: 0;
        padding: 0;
        cursor: pointer;
        color: #ccc;
        font-size: 13px;
        vertical-align: middle;
        display: inline;
    }
    
    .app-items {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        padding: 10px;
    }
    
    .app-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: calc(20% - 12px);
        min-width: 120px;
        max-width: 180px;
        padding: 5px 0;
        box-sizing: border-box;
    }
    
    .app-item input[type="checkbox"] {
        margin: 0;
        flex-shrink: 0;
    }
    
    .app-item label {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        cursor: pointer;
        flex: 1;
        min-width: 0;
    }
    
    .app-item img {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        flex-shrink: 0;
    }
    .app-icon-letter {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1;
        user-select: none;
    }
    
    .app-item label span {
        display: flex;
        align-items: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    
    .btn-primary {
        background: #007bff;
        color: white;
        padding: 8px 20px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 14px;
    }
    
    .btn-primary:hover {
        background: #0056b3;
    }
    
    .btn-secondary {
        background: #6c757d;
        color: white;
        padding: 8px 20px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 14px;
    }
    
    .btn-secondary:hover {
        background: #5a6268;
    }
    
    .empty-state {
        text-align: center;
        padding: 40px;
        color: #999;
    }

    /* 对话框样式 */
    #add-rule-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 10000;
        justify-content: center;
        align-items: center;
    }
    
    #add-rule-modal.show {
        display: flex;
    }
    
    #add-rule-modal .modal-content {
        background-color: #2d2d2d;
        color: #ffffff;
        padding: 20px;
        border-radius: 5px;
        width: 900px;
        max-width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
    }
    
    #add-rule-modal .modal-content h3 {
        margin: 0 0 20px 0;
        color: #fff;
    }
    
    #add-rule-modal .modal-close {
        position: absolute;
        top: 10px;
        right: 10px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        width: 30px;
        height: 30px;
        line-height: 30px;
    }
    
    #add-rule-modal .modal-close:hover {
        color: #ccc;
    }

    #add-rule-modal .modal-content {
        box-sizing: border-box;
        width: 900px;
        max-width: calc(100% - 24px);
        max-height: calc(100vh - 24px);
        background: var(--background-color-high, #fff);
        color: var(--text-color-high, #1f2937);
        border: 1px solid var(--border-color-low, #d1d5db);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    #add-rule-modal .modal-content h3,
    #add-rule-modal .modal-close,
    #add-rule-modal .form-group label,
    #add-rule-modal .category-name {
        color: var(--text-color-high, #1f2937);
    }

    #add-rule-modal .modal-close:hover,
    #add-rule-modal .category-count,
    #add-rule-modal .category-select-all-container label {
        color: var(--text-color-medium, #6b7280);
    }

    #add-rule-modal .rule-form {
        background: transparent;
        border-color: var(--border-color-low, #d1d5db);
    }

    #add-rule-modal .form-group input[type="text"],
    #add-rule-modal .form-group input[type="time"],
    #add-rule-modal .form-group select {
        background: var(--background-color-high, #fff);
        color: var(--text-color-high, #1f2937);
        border-color: var(--border-color-medium, #d1d5db);
    }

    #add-rule-modal .form-group select option {
        background: var(--background-color-high, #fff);
        color: var(--text-color-high, #1f2937);
    }

    #add-rule-modal .time-rule-item,
    #add-rule-modal .app-selection-container,
    #add-rule-modal .category-header {
        background: var(--background-color-low, #f5f5f5);
        color: var(--text-color-high, #1f2937);
        border-color: var(--border-color-low, #d1d5db);
    }

    #add-rule-modal .form-group > div[style*="color: #999"] {
        color: var(--text-color-medium, #6b7280) !important;
    }

    /* 指定用户多选控件（复用 common.css 的 .oaf-check-item） */
    .oaf-user-check-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
    }
    .oaf-user-check-stat {
        color: var(--text-color-medium, #6b7280);
        font-size: 13px;
        white-space: nowrap;
    }
    .oaf-user-check-list {
        min-height: 110px;
        max-height: 180px;
        overflow-y: auto;
        border: 1px solid var(--border-color-low, #d1d5db);
        border-radius: 4px;
        background: var(--background-color-low, #f5f5f5);
    }
    .oaf-user-check-item {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border-color-low, #d1d5db);
        background: var(--background-color-high, #fff);
        color: var(--text-color-high, #1f2937);
        cursor: pointer;
    }
    .oaf-user-check-item:last-child {
        border-bottom: none;
    }
    .oaf-user-check-item:hover {
        background: var(--background-color-medium, #eee);
    }
    .oaf-user-check-item .oaf-check-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0;
    }
    .oaf-user-check-item .oaf-check-item > input[type="checkbox"] {
        margin: 0 10px 0 0;
        flex: 0 0 auto;
    }
    .oaf-user-check-item .oaf-check-item > label {
        flex: 1;
        min-width: 0;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        cursor: pointer;
    }
    [data-darkmode="true"] .oaf-user-check-item:hover {
        background: var(--background-color-medium, rgba(255, 255, 255, 0.08));
    }

</style>

    function loadRules() {
        $.get("<%=url('admin/services/oaf/api/app_filter/get_filter_rules')%>", function(data) {
            if (data && data.code === 0 && Array.isArray(data.data)) {
                rules = data.data;

                rules = rules.map(function(rule) {

                    if (rule.app_ids && !Array.isArray(rule.app_ids)) {
                        rule.app_ids = [];
                    } else if (!rule.app_ids) {
                        rule.app_ids = [];
                    } else {
                        rule.app_ids = expandAppIds(rule.app_ids);
                    }
                    if (rule.time_rules && !Array.isArray(rule.time_rules)) {
                        rule.time_rules = [];
                    } else if (!rule.time_rules) {
                        rule.time_rules = [];
                    }
                    if (rule.filter_quic === undefined || rule.filter_quic === null || isNaN(parseInt(rule.filter_quic, 10))) {
                        rule.filter_quic = 0;
                    } else {
                        rule.filter_quic = parseInt(rule.filter_quic, 10) ? 1 : 0;
                    }
                    return rule;
                });
            } else {
                rules = [];

            rulesLoaded = true;

            if (classListLoaded) {
                renderRulesList();
            }

            rules = [];
            rulesLoaded = true; 
            if (classListLoaded) {
                renderRulesList();
            }
        });

    function expandAppIds(appIds) {
        var result = [];
        var seen = {};
        (appIds || []).forEach(function(item) {
            if (typeof item === 'number') {
                if (!seen[item]) {
                    seen[item] = true;
                    result.push(item);
                }
                return;
            }
            var s = String(item || '').trim();
            if (!s) return;
            var m = s.match(/^(\d+)-(\d+)$/);
            if (m) {
                var start = parseInt(m[1], 10);
                var end = parseInt(m[2], 10);
                if (!isNaN(start) && !isNaN(end) && start > 0 && end >= start) {
                    for (var i = start; i <= end; i++) {
                        if (!seen[i]) {
                            seen[i] = true;
                            result.push(i);
                        }
                    }
                }
                return;
            }
            var v = parseInt(s, 10);
            if (!isNaN(v) && v > 0 && !seen[v]) {
                seen[v] = true;
                result.push(v);
            }
        });
        return result.sort(function(a, b) { return a - b; });
    }

    function compressAppIds(appIds) {
        var ids = Array.from(new Set((appIds || []).map(function(v) {
            return parseInt(v, 10);
        }).filter(function(v) {
            return !isNaN(v) && v > 0;
        }))).sort(function(a, b) { return a - b; });

        if (ids.length === 0) return [];
        var out = [];
        var start = ids[0], prev = ids[0];
        for (var i = 1; i < ids.length; i++) {
            var cur = ids[i];
            if (cur === prev + 1) {
                prev = cur;
                continue;
            }
            out.push(start === prev ? String(start) : (start + '-' + prev));
            start = prev = cur;
        }
        out.push(start === prev ? String(start) : (start + '-' + prev));
        return out;
    }
    
    function getAppCategoriesByRule(rule) {
        var categoryCount = {};
        var normalizedAppIds = expandAppIds(rule && rule.app_ids ? rule.app_ids : []);
        var appIdMap = {};
        
        if (normalizedAppIds.length === 0) {
            return categoryCount;
        }
        normalizedAppIds.forEach(function(id) { appIdMap[id] = true; });
        
        classList.forEach(function(category) {
            var count = 0;
            getCategoryAppList(category).forEach(function(app) {
                var parts = app.split(',');
                var appId = parseInt(parts[0], 10);
                if (appIdMap[appId]) {
                    count++;
                }
            });
            if (count > 0) {
                categoryCount[category.name] = count;
            }
        });
        
        return categoryCount;
    }
    
    function findRuleById(ruleId) {
        for (var k = 0; k < rules.length; k++) {
            if (String(rules[k].id) === String(ruleId)) {
                return rules[k];

        return null;
    }

    function toggleRuleEnabled(ruleId, $input) {
        var want = $input.is(':checked') ? 1 : 0;
        var $label = $input.closest('.oaf-rule-switch');
        var revertTitle = want ? _Disabled : _Enabled;

        function rollback(msg) {
            $input.prop('checked', !want);
            $label.attr('title', revertTitle);
            if (typeof showCommonModal === 'function') {
                showCommonModal(msg, 3000);
            } else {
                alert(msg);
            }
        }

        $input.prop('disabled', true);
        $.post("<%=url('admin/services/oaf/api/app_filter/update_filter_rule')%>",
            { data: JSON.stringify({ id: parseInt(ruleId, 10), enabled: want }) },
            function(data) {
                if (data && data.code === 0) {
                    var target = findRuleById(ruleId);
                    if (target) { target.enabled = want; }
                    $label.attr('title', want ? _Enabled : _Disabled);
                    if (typeof showCommonModal === 'function') {
                        showCommonModal(want ? _RuleEnabledToast : _RuleDisabledToast, 1500);
                    }
                } else {
                    rollback(_FailedToToggleRule + ': ' + ((data && data.message) || _UnknownError));
                }
            }
        ).fail(function() {
            rollback(_FailedToToggleRule + ': ' + _NetworkError);
        }).always(function() {
            $input.prop('disabled', false);
        });
    }

    function copyRule(ruleId) {
        var src = findRuleById(ruleId);
        if (!src) { return; }
        if (rules.length >= 32) {
            if (typeof showCommonModal === 'function') {
                showCommonModal(_MaxRulesReached, 3000);
            } else {
                alert(_MaxRulesReached);
            }
            return;
        }

        var timeRules = (src.time_rules || []).map(function(t) {
            return {
                weekdays: (t.weekdays || []).slice(),
                start_time: t.start_time,
                end_time: t.end_time
            };
        });

        var payload = {
            name: String(src.name || '') + '-copy',
            mode: parseInt(src.mode, 10) || 1,
            user_mac: src.user_mac || '',
            user_macs: Array.isArray(src.user_macs) ? src.user_macs.slice() : [],
            user_name: src.user_name || '',
            time_rules: timeRules,
            app_ids: (src.app_ids || []).slice(),
            enabled: 0,
            filter_quic: src.filter_quic ? 1 : 0
        };

        $.post("<%=url('admin/services/oaf/api/app_filter/add_filter_rule')%>",
            { data: JSON.stringify(payload) },
            function(data) {
                if (data && data.code === 0) {
                    loadRules();
                    if (typeof showCommonModal === 'function') {
                        showCommonModal(_RuleCopiedToast, 2000);
                    } else {
                        alert(_RuleCopiedToast);
                    }
                } else {
                    var msg = _FailedToCopyRule + ': ' + ((data && data.message) || _UnknownError);
                    if (typeof showCommonModal === 'function') {
                        showCommonModal(msg, 3000);
                    } else {
                        alert(msg);
                    }
                }
            }
        ).fail(function() {
            var msg = _FailedToCopyRule + ': ' + _NetworkError;
            if (typeof showCommonModal === 'function') {
                showCommonModal(msg, 3000);
            } else {
                alert(msg);
            }
        });
    }
